# espanso match file

# For a complete introduction, visit the official docs at: https://espanso.org/docs/

# You can use this file to define the base matches (aka snippets)
# that will be available in every application when using espanso.

# Matches are substitution rules: when you type the "trigger" string
# it gets replaced by the "replace" string.
matches:
    - trigger: ':date'
      replace: '{{date}}'
      vars:
          - name: date
            type: date
            params:
                format: '%Y/%m/%d'

    - trigger: ':lorem'
      replace: "Lorem Ipsum is simply dummy text of | the printing and typesetting industry. Lorem Ipsum has been the industry's standard dummy text ever since the 1500s, when an unknown printer took a galley of type and scrambled it to make a type specimen book. It has survived not only five centuries, but also the leap into electronic typesetting, remaining essentially unchanged. It was popularised in the 1960s with the release of Letraset sheets containing Lorem Ipsum passages, and more recently with desktop publishing software like Aldus PageMaker including versions of Lorem Ipsum."

    - trigger: ':prompt:build'
      form: |
          Act as a senior software architect. I need to build [[project]].  
          Let's approach this through:  
            
          1. System requirements and constraints  
          2. Core architectural decisions  
          3. Data models and relationships  
          4. API contract design  
          5. Security considerations  
            
          For each point, challenge my assumptions and suggest alternatives.  
          Use examples from your experience when relevant.

          translate to korean.
    - trigger: ':prompt:imple'
      form: |
          For 
          [[feature]]
          suggest the optimal implementation considering:  

          - Performance impact  
          - Maintenance overhead  
          - Testing strategy  
            
          Code examples should follow 
          [[env]] 
          best practices.

          translate to korean.
      form_fields:
          env:
              multiline: true

    - trigger: ':prompt:review'
      form: |
          Review this implementation:
          [[code]]

          Focus on:

          1. Performance optimizations
          2. Security vulnerabilities
          3. Design pattern improvements
          4. Error handling gaps
      form_fields:
          code:
              multiline: true

    - trigger: ':prompt:doc'
      form: |
          You are a [[field] expert. I need to implement 
          [[feature]]. 
          Walk me through:

          1. The relevant API methods/classes
          2. Common pitfalls and how to avoid them
          3. Performance optimization techniques
          4. Code examples for each key concept

          translate to korean.
      form_fields:
          feature:
              multiline: true
